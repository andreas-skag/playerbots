[project]
name = "brain"
version = "0.1.0"
description = "Human-like playerbot brain sidecar: personas, memory, prompt assembly"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
